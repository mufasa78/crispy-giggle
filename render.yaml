services:
  # The Flask API and web application
  - type: web
    name: shopee-data-api
    env: python
    plan: free
    buildCommand: pip install -r render_requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers=2 main:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopee-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

# Postgres database
databases:
  - name: shopee-postgres
    plan: free
