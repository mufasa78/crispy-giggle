version: '3.8'

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET:-defaultsecretkeythatshouldbereplacedingproduction}
    volumes:
      - ./cookies.txt:/app/cookies.txt

