apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopee-scraper-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: shopee-scraper.example.com  # Replace with your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: shopee-scraper-api
            port:
              number: 80
